name: Build and push to GHCR

# ── 触发时机 ──
#   push 到主分支        → 构建并推送（latest + sha-xxxx）
#   push 一个 v1.2.3 标签 → 额外打出 1.2.3 / 1.2 这样的语义化标签
#   开 PR                → 只编译 amd64、不推送（当编译检查用，省得合并了才发现编不过）
#
# ── 架构：amd64 / arm64 拆两个 job 并行 ──
#   这里刻意**不**用一个 job + platforms: linux/amd64,linux/arm64 同时编。
#   原因是那种写法 arm64 要跑在 QEMU 模拟下，而 better-sqlite3 是原生模块，
#   npm install 时（预编译包没命中就要）现场编译 C++，模拟环境下能拖到十几分钟，
#   而且它会**卡住整个镜像发布**——amd64 用户明明 40 秒就能好，也得干等。
#
#   拆开之后：
#     build-amd64 → x86 runner 原生编译，几十秒
#     build-arm64 → ARM runner 原生编译，也是原生速度（无 QEMU）
#     两个都只推「digest」（镜像传上去了但**不打 tag**）
#     merge       → 等两边都好，把两个 digest 合成一个 manifest list，再统一打 tag
#
#   好处：任一架构翻车不影响另一个；耗时 = 慢的那个，不再是两者相加。
#   对用户完全无感：docker compose pull 时 Docker 按本机架构自动挑，命令不用改。
#
#   ⚠️ 想退回「只出 amd64」的话：删掉 build-arm64 和 merge 两个 job，
#      再把 build-amd64 里那个 push-by-digest 步骤换回普通 tags/push 即可。
on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# 同一分支/同一 tag 只保留一次构建：连推几个 commit 时旧 run 直接取消，
# 省得两个 run 并发写同一个 latest 互相覆盖（tag push 有自己的 ref，不受影响）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # ⚠️ 故意不写死用户名/组织名：直接取「owner/repo」，
  #    这样仓库改名、转组织、fork 出去都不用动这个文件。
  #    ⚠️⚠️ 但它是**大小写敏感的原文**（本仓库 = yezi8430/Chatz），而 GHCR 要求镜像名
  #    全小写。metadata-action 会自动转小写，buildx 的 outputs 不会 ——
  #    所以每个 job 里都要先跑一次「Normalize image name」步骤拿到小写版再用。
  #    （2026-10-06 run #38 就是栽在这：failed to parse ref ".../Chatz": must be lowercase）
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ══════════════════ 1/3  amd64（x86 原生） ══════════════════
  build-amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # ← 推 GHCR 必须有这一条，否则 403
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR 要求镜像名全小写；github.repository 原样带着大写，先转掉
      - name: Normalize image name
        id: repo
        run: echo "image=${REGISTRY}/$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN 是 Actions 自动注入的，不用自己建密钥
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags + labels)
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # PR：只当编译体检，不推任何东西
      - name: Build only (pull request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          # ⚠️ 如果你的仓库根目录**不是** chatz 服务端（比如把 服务端/ 客户端/ 插件/
          #    三个目录一起塞进一个仓库），这里要改：
          #      context: ./服务端
          #      file: ./服务端/Dockerfile
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=chatz-amd64

      # 正常推送：只推 digest，不打 tag（tag 统一由 merge job 打）
      - name: Build and push by digest
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          # push-by-digest：镜像传上去了，但只是 sha256 形式的裸引用，
          # 没有 latest / sha-xxxx 这些 tag 指向它。等 merge 合成 manifest list 再挂。
          outputs: type=image,name=${{ steps.repo.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          # provenance 证明文件会以 unknown/unknown 架构混进 manifest list，用不上，关掉
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          # 用 GitHub Actions 的缓存，第二次构建能省下大半时间
          # scope 写死：两个架构的缓存不能共用同一个 key，否则互相覆盖
          cache-from: type=gha,scope=chatz-amd64
          cache-to: type=gha,scope=chatz-amd64,mode=max

  # ══════════════════ 2/3  arm64（ARM 原生，跳过 PR） ══════════════════
  build-arm64:
    # PR 不用给两个架构都做体检，跑一个 amd64 就够了，省时间
    if: github.event_name != 'pull_request'
    # ⚠️ ubuntu-24.04-arm 是 GitHub 给**公开仓库**免费提供的原生 ARM runner，
    #    不用装 QEMU，跟 amd64 一样是原生速度。
    #    如果哪天仓库转私有（免费版没有 ARM runner），把这里改回 ubuntu-latest，
    #    并在下面 Checkout 之后加一步：
    #      - name: Set up QEMU
    #        uses: docker/setup-qemu-action@v3
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name
        id: repo
        run: echo "image=${REGISTRY}/$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.image }}
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          outputs: type=image,name=${{ steps.repo.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=chatz-arm64
          cache-to: type=gha,scope=chatz-arm64,mode=max

  # ══════════════════ 3/3  合成 manifest list 并打 tag ══════════════════
  merge:
    # 用 always() 是为了：万一 arm64 那边挂了（比如 ARM runner 排队不到），
    # 也要照常把 amd64 发出去，不能让 latest 卡着不更新。
    # 但 amd64 自己失败就老实停下，别拿坏镜像覆盖 latest。
    if: ${{ github.event_name != 'pull_request' && needs.build-amd64.result == 'success' && always() }}
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Normalize image name
        id: repo
        run: echo "image=${REGISTRY}/$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create manifest list
        env:
          IMG: ${{ steps.repo.outputs.image }}
          AMD64: ${{ needs.build-amd64.outputs.digest }}
          ARM64: ${{ needs.build-arm64.outputs.digest }}
        run: |
          set -eu
          # steps.meta.outputs.tags 是多行文本，拼成 "-t a -t b -t c"
          TAGS="${{ steps.meta.outputs.tags }}"
          SRC="${IMG}@${AMD64}"
          # arm64 没拿到 digest 就退化成只发 amd64（见上面 job 级的 always()）
          if [ -n "${ARM64:-}" ]; then
            SRC="${SRC} ${IMG}@${ARM64}"
          fi
          echo "sources: ${SRC}"
          docker buildx imagetools create $(printf ' -t %s' $TAGS) ${SRC}

          # 打个回显确认里面躺着哪些架构
          # （打 tag 构建时没有 latest，所以取列表第一行，别写死 latest）
          FIRST_TAG="$(printf '%s\n' "$TAGS" | head -1)"
          docker buildx imagetools inspect "$FIRST_TAG"
